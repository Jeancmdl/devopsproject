title = "devopsproject"

[extend]
useDefault = true

# Private IPv4 ranges (RFC 1918). Examples must use RFC 5737 documentation ranges instead.
[[rules]]
id = "private-ipv4"
description = "Private IPv4 address"
regex = '''\b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b'''
keywords = ["10.", "192.168.", "172."]

# AWS account IDs in ARNs.
[[rules]]
id = "aws-account-in-arn"
description = "AWS account ID in an ARN"
regex = '''arn:aws:[a-z0-9-]+:[a-z0-9-]*:\d{12}:'''
keywords = ["arn:aws"]

[allowlist]
description = "Documentation values"
regexes = ['''123456789012''']
