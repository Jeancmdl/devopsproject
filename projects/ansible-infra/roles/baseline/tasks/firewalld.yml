---
- name: Ensure firewalld is running
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: Allow services
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ baseline_firewalld_services }}"

- name: Allow custom SSH port
  ansible.posix.firewalld:
    port: "{{ baseline_ssh_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  when: baseline_ssh_port | int != 22
