---
- name: Validate supported OS family
  ansible.builtin.assert:
    that: ansible_facts['os_family'] == 'RedHat'
    fail_msg: "The baseline role supports RHEL-family systems only."

- name: Install packages
  ansible.builtin.import_tasks: packages.yml

- name: Configure SELinux
  ansible.builtin.import_tasks: selinux.yml

- name: Manage users
  ansible.builtin.import_tasks: users.yml

- name: Harden SSH
  ansible.builtin.import_tasks: ssh.yml

- name: Configure firewalld
  ansible.builtin.import_tasks: firewalld.yml
